[package]
name = "win_iphone_guard"
version = "0.1.0"
edition = "2021"

[dependencies]
rdev = "0.5"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "winbase", "synchapi", "errhandlingapi", "winerror"] }

ureq = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
